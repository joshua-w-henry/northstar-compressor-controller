[env:miniatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino

upload_speed = 115200
monitor_speed = 115200

; BENCH I/O COMMISSIONING MODE:
; Compile the standalone bench console instead of the normal state machine.
; Remove/comment this line when Phase 0 automatic-control testing resumes.
build_src_filter = -<main.cpp> +<bench_io.cpp>

; Bench console only needs the CAN library. Keeping the OLED/FRAM libraries
; out of this temporary build avoids compiling their dependency trees.
lib_deps =
  autowp/autowp-mcp2515
