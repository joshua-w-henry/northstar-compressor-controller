[env:miniatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino

upload_speed = 115200
monitor_speed = 115200

; Normal Phase 0 build: compile main controller only.
; bench_io.cpp remains in src for future commissioning, but is excluded here.
build_src_filter = +<main.cpp> -<bench_io.cpp>

lib_deps =
  autowp/autowp-mcp2515
  olikraus/U8g2
  adafruit/Adafruit FRAM I2C
